  <style>
/* ===== 1. Farben & Grundwerte (Variablen) ===== */
:root {
  --bg-0: #03070d;        /* tiefster Hintergrund */
  --bg-1: #08121f;        /* Flächen */
  --bg-2: #0d1c30;        /* Eingabefeld, Sprechblasen */
  --line: #15324f;        /* feine Linien */
  --cyan: #3de8ff;        /* Hauptakzent */
  --blue: #2f7bff;        /* Zweitakzent */
  --text: #e3f2ff;
  --text-dim: #7f9bb8;
  --radius: 18px;
  --font: "Avenir Next", "Helvetica Neue", -apple-system, "SF Pro Text", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* Sanftes Leuchten im Hintergrund */
body {
  background:
    radial-gradient(ellipse 70% 40% at 50% -10%, rgba(47, 123, 255, 0.22), transparent 70%),
    var(--bg-0);
}

/* ===== 2. Layout: Kopfzeile, Chat, Eingabe ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: var(--app-h, 100dvh);   /* korrekte Höhe in Safari, passt sich der Tastatur an */
  max-width: 900px;
  margin: 0 auto;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}

.title h1 {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  color: var(--cyan);
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-dim);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}

/* ===== 3. Der Reaktor (das markante Element) ===== */
.reactor {
  position: relative;
  width: 58px;
  height: 58px;
  flex-shrink: 0;
}

.reactor .ring,
.reactor .core {
  position: absolute;
  border-radius: 50%;
}

.ring-outer {
  inset: 0;
  border: 2px solid transparent;
  border-top-color: var(--cyan);
  border-bottom-color: var(--cyan);
  animation: spin 8s linear infinite;
}

.ring-middle {
  inset: 9px;
  border: 2px dashed rgba(61, 232, 255, 0.55);
  animation: spin 12s linear infinite reverse;
}

.ring-inner {
  inset: 18px;
  border: 2px solid var(--blue);
  box-shadow: 0 0 10px rgba(47, 123, 255, 0.7);
}

.core {
  inset: 25px;
  background: radial-gradient(circle, #ffffff 0%, var(--cyan) 55%, transparent 100%);
  animation: pulse 3s ease-in-out infinite;
}

/* Wenn JARVIS "nachdenkt", dreht sich der Reaktor schneller */
.reactor.thinking .ring-outer  { animation-duration: 1.6s; }
.reactor.thinking .ring-middle { animation-duration: 2.4s; }
.reactor.thinking .core        { animation-duration: 0.9s; }

@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes pulse {
  0%, 100% { opacity: 0.75; transform: scale(0.9); }
  50%      { opacity: 1;    transform: scale(1.15); }
}

/* Wenn JARVIS spricht, pulsiert der Kern schneller */
.reactor.speaking .core        { animation-duration: 0.7s; }
.reactor.speaking .ring-outer  { animation-duration: 3s; }

/* Schalter für die Sprachausgabe (NEU in 1.1) */
.voice-toggle { margin-left: auto; }
.voice-toggle .waves { display: none; }
.voice-toggle .slash { display: block; }
.voice-toggle.on {

.voice-toggle.on .slash { display: none; }

/* ===== 4. Nachrichten ===== */
.chat {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  display: flex;
  flex-direction: column;

@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }

/* JARVIS: links, dunkel, cyanfarbene Linie */

  background: linear-gradient(135deg, #1b4fb8, #2f7bff);

}

/* Systemhinweise (z. B. Mikrofon): zentriert, dezent */
.msg.system {

/* "JARVIS schreibt …" Animation */
.typing {

}

.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40%           { opacity: 1; }

/* ===== 5. Eingabebereich ===== */
.composer {
  display: flex;

@keyframes listen {

/* Sprachschalter (NEU in 1.5) */

/* ===== 5b. Schnellbefehle (NEU in 1.2) ===== */

/* ===== 6. Kleine Bildschirme ===== */

/* ===== 6b. Kleine Ärgernisse auf dem iPad (NEU in 1.4.1) ===== */

/* ===== 7. Bewegung reduzieren, falls im iPad so eingestellt ===== */

  <script>
/* =====================================================
   J.A.R.V.I.S. Version 2.0.0 – Funktionen
   ===================================================== */

/* ----- 1. Elemente aus der HTML-Seite holen ----- */
const chatEl     = document.getElementById("chat");
const formEl     = document.getElementById("composer");
const inputEl    = document.getElementById("input");
const sendBtn    = document.getElementById("send-btn");
const micBtn     = document.getElementById("mic-btn");
const reactorEl  = document.getElementById("reactor");
const voiceBtn   = document.getElementById("voice-btn");
const langBtn    = document.getElementById("lang-btn");
const statusEl   = document.getElementById("status-text");

/* --- Sprache (NEU in 1.5): "de" oder "en" --- */
const LANG_KEY = "jarvis-sprache-v1";
let lang = "de";
try {
  const savedLang = localStorage.getItem(LANG_KEY);
  if (savedLang === "en" || savedLang === "de") lang = savedLang;
} catch (e) {}
function L(de, en) { return lang === "en" ? en : de; }

/* --- KI-Anbindung (NEU in 2.0) ---
   Die Adresse des eigenen KI-Servers wird NUR im Browser gespeichert.
   Ein API-Schlüssel kommt hier nie vor. */
const AI_KEY = "jarvis-ki-adresse-v1";
let aiUrl = "";
try { aiUrl = localStorage.getItem(AI_KEY) || ""; } catch (e) {}

function updateStatus() {
  statusEl.lastChild.textContent = aiUrl
    ? L("Online, KI verbunden", "Online, AI connected")
    : L("Online, KI-Modul noch nicht verbunden", "Online, AI module not connected yet");
}

/* ----- 2. Chatverlauf (bleibt während der Sitzung erhalten) ----- */
// Der Verlauf liegt in einer Liste. Zusätzlich speichern wir ihn in
// sessionStorage: Das überlebt ein Neuladen im selben Safari-Tab,
// wird aber gelöscht, sobald der Tab geschlossen wird.
const STORAGE_KEY = "jarvis-verlauf-v1";
let history = [];   // Einträge: { role: "jarvis" | "user" | "system", text: "...", tag: "..." }

function saveHistory() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) {
    // Speichern nicht möglich (z. B. privater Modus): kein Problem, der Chat läuft trotzdem.
  }
}

function loadHistory() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

/* ----- 3. Nachrichten anzeigen ----- */
function renderMessage(entry) {
  const div = document.createElement("div");
  div.className = "msg " + entry.role;

  if (entry.role === "jarvis") {
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = "JARVIS";
    div.appendChild(who);
  }

  // textContent statt innerHTML: Eingaben werden nie als Code ausgeführt (Sicherheit).
  const body = document.createElement("span");
  body.textContent = entry.text;
  div.appendChild(body);

  if (entry.tag) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = entry.tag;
    div.appendChild(tag);
  }

  chatEl.appendChild(div);
  scrollToBottom();
}

function addMessage(role, text, tag) {
  const entry = { role, text, tag };
  history.push(entry);
  saveHistory();
  renderMessage(entry);
}

function scrollToBottom() {
  chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: "smooth" });
}

/* ----- 4. "JARVIS schreibt …" Anzeige ----- */
let typingEl = null;

function showTyping() {
  typingEl = document.createElement("div");
  typingEl.className = "msg jarvis typing";
  typingEl.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(typingEl);
  reactorEl.classList.add("thinking");   // Reaktor dreht schneller
  scrollToBottom();
}

function hideTyping() {
  if (typingEl) typingEl.remove();
  typingEl = null;
  reactorEl.classList.remove("thinking");
}

/* ----- 5. Begrüßung ----- */
function greeting() {
  const hour = new Date().getHours();
  if (lang === "en") {
    const partEn = hour < 11 ? "Good morning" : (hour >= 18 ? "Good evening" : "Good afternoon");
    return partEn + ", Sir. All systems are online. No AI is connected yet, but I can already tell the time and date, run timers and calculate. Say \u201Chelp\u201D for an overview.";
  }
  let part = "Guten Tag";
  if (hour < 11) part = "Guten Morgen";
  else if (hour >= 18) part = "Guten Abend";
  return part + ", Sir. Alle Systeme laufen. Eine KI ist noch nicht angeschlossen, aber Uhrzeit, Datum, Timer und Rechnen beherrsche ich bereits. Sagen Sie \u201EHilfe\u201C für die Übersicht.";
}

/* ----- 6. PLATZHALTER für die spätere KI-Anbindung -----
   Hier wird später die echte KI angebunden.

   WICHTIG: Den API-Schlüssel NIEMALS hier im Frontend speichern.
   Jeder könnte ihn im Browser auslesen. Der richtige Weg:
     Browser (diese Seite)  ->  eigener kleiner Server  ->  KI-Dienst
   Der Schlüssel liegt nur auf dem Server. Die Seite schickt dann
   nur den Text an deinen Server, zum Beispiel so:

     const antwort = await fetch("/api/chat", {
       method: "POST",
       headers: { "Content-Type": "application/json" },
       body: JSON.stringify({ message: userText })
     });
     const daten = await antwort.json();
     return { text: daten.reply, tag: null };

   Bis dahin gibt die Funktion ehrlich zurück, dass keine KI verbunden ist.
*/
// Fragt den eigenen KI-Server (NEU in 2.0)
async function askAI(userText) {
  const messages = history
    .filter(h => (h.role === "user" || h.role === "jarvis") && !(h.tag && /^(Fehler|Error)/.test(h.tag)))
    .slice(-12)
    .map(h => ({ role: h.role === "user" ? "user" : "assistant", content: h.text }));
  if (messages.length === 0 || messages[messages.length - 1].role !== "user") {
    messages.push({ role: "user", content: userText });
  }

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);   // nach 30 Sekunden aufgeben
  try {
    const response = await fetch(aiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages, lang: lang }),
      signal: controller.signal
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.reply) {
      throw new Error(data.error || ("HTTP " + response.status));
    }
    // Markdown-Zeichen entfernen, damit nichts Seltsames angezeigt oder vorgelesen wird
    return String(data.reply).replace(/\*\*/g, "").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "").trim();
  } finally {
    clearTimeout(timer);
  }
}

async function getJarvisReply(userText) {
  const commandReply = handleCommand(userText);
  if (commandReply !== null) {
    await sleep(350);
    return { text: commandReply, tag: commandTag() };
  }

  if (aiUrl) {
    try {
      const reply = await askAI(userText);
      return { text: reply, tag: L("KI-Antwort, kann Fehler enthalten", "AI reply, may contain errors") };
    } catch (error) {
      const reason = error && error.name === "AbortError"
        ? L("Zeitüberschreitung", "timeout")
        : ((error && error.message) || "?");
      return {
        text: L("Die KI ist gerade nicht erreichbar, Sir. (" + reason + ")", "The AI is unreachable at the moment, Sir. (" + reason + ")"),
        tag: L("Fehler, keine KI-Antwort", "Error, no AI reply")
      };
    }
  }

  await sleep(700);
  return {
    text: L(
      "Ihre Nachricht ist angekommen, Sir: \u201E" + userText + "\u201C. Inhaltlich antworten kann ich noch nicht, denn es ist keine KI verbunden. Mit \u201EKI Status\u201C und \u201EHilfe\u201C sehen Sie, was möglich ist.",
      "Your message has arrived, Sir: \u201C" + userText + "\u201D. I cannot answer its content yet, as no AI is connected. \u201CAI status\u201D and \u201Chelp\u201D show what is possible."
    ),
    tag: L("Platzhalter-Antwort, keine echte KI", "Placeholder reply, not a real AI")
  };
}

/* ----- 6c. LOKALE BEFEHLE (NEU in 1.2) -----
   Das ist KEINE KI. Es sind feste Regeln: Erkennt JARVIS ein Stichwort
   (z. B. "Uhrzeit"), führt er die passende Funktion aus. Alles andere
   geht weiter an den KI-Platzhalter. */
const timers = [];   // laufende Timer (nur solange die Seite offen ist)

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const sec = Math.round(totalSeconds % 60);
  const parts = [];
  if (lang === "en") {
    if (h)   parts.push(h + (h === 1 ? " hour" : " hours"));
    if (m)   parts.push(m + (m === 1 ? " minute" : " minutes"));
    if (sec) parts.push(sec + (sec === 1 ? " second" : " seconds"));
    return parts.join(", ") || "0 seconds";
  }
  if (h)   parts.push(h + (h === 1 ? " Stunde" : " Stunden"));
  if (m)   parts.push(m + (m === 1 ? " Minute" : " Minuten"));
  if (sec) parts.push(sec + (sec === 1 ? " Sekunde" : " Sekunden"));
  return parts.join(", ") || "0 Sekunden";
}

/* --- Uhrzeit und Datum --- */
function timeAnswer() {
  const now = new Date();
  const text = now.toLocaleTimeString(lang === "en" ? "en-GB" : "de-DE", { hour: "2-digit", minute: "2-digit" });
  if (lang === "en") {
    let answerEn = "It is " + text;
    if (now.getHours() < 5) answerEn += ". A remarkable hour for engineering work";
    return answerEn;
  }
  let answer = "Es ist " + text + " Uhr";
  if (now.getHours() < 5) answer += ". Eine bemerkenswerte Stunde für Ingenieursarbeit";
  return answer;
}

function dateAnswer() {
  const text = new Date().toLocaleDateString(lang === "en" ? "en-GB" : "de-DE", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  return L("Heute ist ", "Today is ") + text;
}

/* --- Timer --- */
function parseSeconds(t) {
  const pattern = /(\d+(?:[.,]\d+)?)\s*(stunden?|std|hours?|hrs?|h|minuten?|minutes?|mins?|min|sekunden?|seconds?|secs?|sek|s)\b/g;
  let total = 0;
  let match;
  while ((match = pattern.exec(t)) !== null) {
    const amount = parseFloat(match[1].replace(",", "."));
    const unit = match[2];
    if (/^(h|std|stunden?|hours?|hrs?)$/.test(unit)) total += amount * 3600;
    else if (/^(min|mins|minuten?|minutes?)$/.test(unit)) total += amount * 60;
    else total += amount;
  }
  return Math.round(total);
}

function startTimer(t) {
  const seconds = parseSeconds(t);
  if (seconds <= 0) {
    return L("Wie lange soll der Timer laufen, Sir? Zum Beispiel: \u201ETimer 5 Minuten\u201C.", "How long should the timer run, Sir? For example: \u201Ctimer 5 minutes\u201D.");
  }
  if (seconds > 24 * 3600) {
    return L("Mehr als 24 Stunden kann ich nicht überwachen, Sir. Selbst meine Geduld hat Grenzen.", "I cannot monitor more than 24 hours, Sir. Even my patience has limits.");
  }
  if (timers.length >= 5) {
    return L("Fünf Timer laufen bereits, Sir. Ich rate zu einer Priorisierung.", "Five timers are already running, Sir. I suggest some prioritisation.");
  }
  const label = formatDuration(seconds);
  const handle = setTimeout(function () {
    const index = timers.findIndex(x => x.handle === handle);
    if (index !== -1) timers.splice(index, 1);
    const message = L("Der Timer von " + label + " ist abgelaufen, Sir.", "The timer for " + label + " has finished, Sir.");
    addMessage("jarvis", message, commandTag());
    speak(message);
  }, seconds * 1000);
  timers.push({ handle, label });
  return L(
    "Timer auf " + label + " gestellt, Sir. Bitte lassen Sie diese Seite geöffnet, sonst kann ich nicht Bescheid geben.",
    "Timer set for " + label + ", Sir. Please keep this page open, otherwise I cannot alert you."
  );
}

function cancelTimers() {
  if (timers.length === 0) return L("Es läuft kein Timer, Sir.", "No timer is running, Sir.");
  const count = timers.length;
  timers.forEach(x => clearTimeout(x.handle));
  timers.length = 0;
  if (lang === "en") return count === 1 ? "The timer has been cancelled, Sir." : count + " timers have been cancelled, Sir.";
  return count === 1 ? "Der Timer wurde abgebrochen, Sir." : count + " Timer wurden abgebrochen, Sir.";
}

/* --- Taschenrechner (ohne eval, nur + - * / und Klammern) --- */
function calculate(raw) {
  const s = raw.replace(/\s+/g, "").replace(/,/g, ".").replace(/[x×]/g, "*").replace(/:/g, "/");
  let pos = 0;

  function parseExpr() {
    let value = parseTerm();
    while (s[pos] === "+" || s[pos] === "-") {
      const op = s[pos++];
      const right = parseTerm();
      value = op === "+" ? value + right : value - right;
    }
    return value;
  }
  function parseTerm() {
    let value = parseFactor();
    while (s[pos] === "*" || s[pos] === "/") {
      const op = s[pos++];
      const right = parseFactor();
      value = op === "*" ? value * right : value / right;
    }
    return value;
  }
  function parseFactor() {
    if (s[pos] === "-") { pos++; return -parseFactor(); }
    if (s[pos] === "+") { pos++; return parseFactor(); }
    if (s[pos] === "(") {
      pos++;
      const value = parseExpr();
      if (s[pos] !== ")") throw new Error("Klammer fehlt");
      pos++;
      return value;
    }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(pos));
    if (!m) throw new Error("Zahl erwartet");
    pos += m[0].length;
    return parseFloat(m[0]);
  }

  try {
    const result = parseExpr();
    return pos === s.length ? result : null;
  } catch (e) {
    return null;
  }
}

function calcAnswer(t) {
  // Füllwörter vorne entfernen, Wörter in Zeichen umwandeln
  const candidate = t
    .replace(/^(rechne|berechne|was ist|was ergibt|wie viel ist|wieviel ist)\s*/, "")
    .replace(/\bgeteilt durch\b/g, "/")
    .replace(/\bdurch\b/g, "/")
    .replace(/\bmal\b/g, "*")
    .replace(/\bplus\b/g, "+")
    .replace(/\bminus\b/g, "-")
    .replace(/[?=]+$/, "")
    .trim();

  const looksLikeMath = /^[\d\s.,+\-*/()x×:]+$/.test(candidate)
    && /\d/.test(candidate)
    && /[+\-*/x×:]/.test(candidate);
  if (!looksLikeMath) return null;

  const result = calculate(candidate);
  if (result === null) return null;
  if (!isFinite(result)) return L("Durch null zu teilen überlasse ich den Philosophen, Sir.", "Division by zero is a matter for philosophers, Sir.");

  const shown = Number(result.toFixed(10)).toLocaleString("de-DE", { maximumFractionDigits: 10 });
  return L("Das Ergebnis lautet ", "The result is ") + shown;
}

/* --- NEU in 1.4: Zufall, Witze, Vorstellung, Verlauf löschen --- */
function rollDice(t) {
  const m = /(\d+)/.exec(t);
  let sides = m ? parseInt(m[1], 10) : 6;
  if (sides < 2 || sides > 1000) sides = 6;
  const result = Math.floor(Math.random() * sides) + 1;
  if (lang === "en") return "The " + (sides === 6 ? "die" : sides + "-sided die") + " shows " + result + ", Sir.";
  return "Der " + (sides === 6 ? "Würfel" : "Würfel mit " + sides + " Seiten") + " zeigt " + result + ", Sir.";
}

function coinAnswer() {
  const heads = Math.random() < 0.5;
  if (lang === "en") return "The coin shows " + (heads ? "heads" : "tails") + ", Sir.";
  return "Die Münze zeigt " + (heads ? "Kopf" : "Zahl") + ", Sir.";
}

function randomNumberAnswer(t) {
  const numbers = (t.match(/\d+/g) || []).map(Number);
  let min = 1, max = 100;
  if (numbers.length >= 2) {
    min = Math.min(numbers[0], numbers[1]);
    max = Math.max(numbers[0], numbers[1]);
  }
  const result = Math.floor(Math.random() * (max - min + 1)) + min;
  if (lang === "en") return "Your random number between " + min + " and " + max + " is " + result + ", Sir.";
  return "Ihre Zufallszahl zwischen " + min + " und " + max + " lautet " + result + ", Sir.";
}

/* --- Zentrale: erkennt den Befehl. Gibt Text zurück oder null (= kein Befehl) --- */
// KI verbinden, trennen, Status (NEU in 2.0). Die Adresse behält ihre Groß- und Kleinschreibung.
function aiCommand(userText) {
  const text = userText.trim();
  const connect = /^(?:ki|ai)\s+(?:verbinden|connect)\s+(\S+)$/i.exec(text) || /^connect\s+ai\s+(\S+)$/i.exec(text);
  if (connect) {
    const url = connect[1].replace(/\/+$/, "");
    if (!/^https:\/\/[\w.-]+(\/\S*)?$/i.test(url)) {
      return L("Die Adresse muss mit https:// beginnen, Sir.", "The address must start with https://, Sir.");
    }
    aiUrl = url;
    try { localStorage.setItem(AI_KEY, url); } catch (e) {}
    updateStatus();
    return L(
      "KI verbunden, Sir. Ab jetzt beantwortet sie alles, was keine feste Funktion ist. Ihre Nachrichten gehen dazu an Ihren Server und das KI-Modell. Geben Sie deshalb keine Passwörter oder vertraulichen Daten ein.",
      "AI connected, Sir. From now on it answers everything that is not a fixed function. Your messages go to your server and the AI model, so please do not enter passwords or confidential data."
    );
  }
  if (/^(?:ki|ai)\s+(?:trennen|disconnect)$/i.test(text) || /^disconnect\s+ai$/i.test(text)) {
    aiUrl = "";
    try { localStorage.removeItem(AI_KEY); } catch (e) {}
    updateStatus();
    return L("KI getrennt, Sir. Ich bin wieder auf die festen Funktionen beschränkt.", "AI disconnected, Sir. I am back to the fixed functions.");
  }
  if (/^(?:ki|ai)\s*status$/i.test(text)) {
    return aiUrl
      ? L("Die KI ist verbunden, Sir. Server: " + aiUrl, "The AI is connected, Sir. Server: " + aiUrl)
      : L("Es ist keine KI verbunden, Sir. Mit \u201EKI verbinden\u201C und Ihrer Server-Adresse ändern wir das.", "No AI is connected, Sir. Use \u201Cconnect AI\u201D and your server address to change that.");
  }
  return null;
}

function commandTag() {

}

// Sprachwahl per Befehl
function languageCommand(t) {
  if (/\b(english|englisch|in english|speak english|sprich englisch)\b/.test(t)) return setLanguage("en");
  if (/\b(deutsch|german|auf deutsch|sprich deutsch)\b/.test(t)) return setLanguage("de");
  return null;
}

// Übersetzt typische englische Eingaben in die deutschen Befehle, die JARVIS schon kennt
function englishToGerman(t) {
  const rules = [
    [/\b(what time is it|what'?s the time|current time|time is it)\b/, "wie spät ist es"],
    [/\b(what'?s the date|what date|today'?s date|what day is it)\b/, "welches datum"],
    [/\b(cancel|stop|abort)\b[^.?!]*\btimer\b|\btimer\b[^.?!]*\b(cancel|stop|abort)\b/, "timer abbrechen"],
    [/\b(set (a )?timer|timer for)\b/, "timer"],
    [/\b(roll|dice)\b/, "würfel"],
    [/\b(flip|coin)\b/, "münze werfen"],
    [/\bjoke\b/, "witz"],
    [/\b(who are you|introduce yourself)\b/, "wer bist du"],
    [/\b(clear|reset) (the )?chat\b|\bclear history\b/, "verlauf löschen"],
    [/^(help|commands)$|\bwhat can you do\b/, "hilfe"],
    [/^(hello|hi|hey)\b/, "hallo"],
    [/^(thanks|thank you)\b/, "danke"],
    [/\b(switch|change|next) voice\b/, "stimme wechseln"],
    [/\b(which|list) voices?\b/, "welche stimme"],
    [/\bspeak slower\b|\bslower\b/, "sprich langsamer"],
    [/\bspeak faster\b|\bfaster\b/, "sprich schneller"],
    [/\b(lower|deeper) voice\b|\bdeeper\b/, "stimme tiefer"],
    [/\bmale voice\b/, "stimme männlich"],
    [/\b(calculate|what is|what's)\b/, "rechne"]
  ];
  let out = t;
  for (const [re, replacement] of rules) {
    if (re.test(out)) { out = out.replace(re, replacement); break; }
  }
  return out
    .replace(/\btimes\b/g, "mal")
    .replace(/\bdivided by\b/g, "geteilt durch")
    .trim();
}

function handleCommand(userText) {
  const aiReply = aiCommand(userText);
  if (aiReply !== null) return aiReply;
  const langReply = languageCommand(userText.toLowerCase().trim());
  if (langReply !== null) return langReply;
  const t = englishToGerman(userText.toLowerCase().trim());

  // Timer
  if (/\b(timer|stoppuhr)\b/.test(t) || /\berinnere\b/.test(t)) {
    if (/(abbrech|stopp|lösch|beend|aus\b)/.test(t)) return cancelTimers();
    return startTimer(t);
  }

  // Uhrzeit und/oder Datum
  const wantsTime = /(uhrzeit|wie spät|wie spaet|wie viel uhr|wieviel uhr)/.test(t);
  const wantsDate = /(datum|welcher tag|welchen tag|wochentag)/.test(t);
  if (wantsTime && wantsDate) return dateAnswer() + ". " + timeAnswer() + ", Sir.";
  if (wantsTime) return timeAnswer() + ", Sir.";
  if (wantsDate) return dateAnswer() + ", Sir.";

  // Hilfe
  if (/\b(hilfe|befehle)\b/.test(t) || /was kannst du/.test(t)) return helpText();

  // NEU in 1.4: Zufall, Witz, Vorstellung, Verlauf löschen
  if (/\bwürfel\w*/.test(t)) return rollDice(t);
  if (/(münze|muenze|kopf oder zahl)/.test(t)) return coinAnswer();
  if (/zufallszahl/.test(t)) return randomNumberAnswer(t);
  if (/\bwitz\b/.test(t) || /was lustiges/.test(t)) return jokeAnswer();
  if (/(wer bist du|wie heißt du|stell dich vor|welche version)/.test(t)) return whoText();
  if (/(verlauf|chat)\s*(löschen|leeren|zurücksetzen)/.test(t) || /^neustart$/.test(t)) return clearChat();

  // NEU in 1.4.6: Preset für eine tiefere, ruhigere Klangfarbe (keine echte männliche Stimme)
  if (/stimme\s*(männlich|maennlich|männlicher|maennlicher|tief)/.test(t)) {
    voicePrefs.pitch = 0.6;
    voicePrefs.rate = 0.9;
    savePrefs();
    return "Ich habe die Klangfarbe tiefer und ruhiger gestellt, Sir. Eine echte männliche Stimme kann ich mit den vorhandenen Stimmen nicht anbieten, aber so klingt es nach Butler.";
  }
  if (/stimme\s*(weiblich|normal)/.test(t)) {
    voicePrefs.pitch = 1.0;
    voicePrefs.rate = 0.95;
    savePrefs();
    return "Ich habe die Klangfarbe auf normal zurückgestellt, Sir.";
  }

  // NEU in 1.4.2: Stimme einstellen
  if (/(stimme|stimmen)\s*(wechseln|ändern|aendern|tauschen)|andere stimme|nächste stimme/.test(t)) return switchVoice(/\balle\b/.test(t));
  if (/(stimme|sprich|sprecher|rede)[^.?!]*\b(tiefer|höher|schneller|langsamer)\b/.test(t)) return tuneVoice(t);
  if (/stimme\s*(zurücksetzen|standard)/.test(t)) return resetVoice();
  if (/(welche stimme|stimmen auflisten)/.test(t)) return listVoices();

  // Rechnen
  const calc = calcAnswer(t);
  if (calc !== null) return calc + ", Sir.";

  // Kleine Höflichkeiten
  if (/^(hallo|hi|hey|guten (morgen|tag|abend))\b/.test(t)) return L("Zu Diensten, Sir.", "At your service, Sir.");
  if (/^(danke|vielen dank)\b/.test(t)) return L("Stets zu Diensten, Sir.", "Always at your service, Sir.");

  return null;
}

/* ----- 6b. SPRACHAUSGABE (überarbeitet in 1.4.1) -----
   Nutzt die eingebaute Browser-Stimme (speechSynthesis): kostenlos, ohne Anmeldung.
   Safari auf dem iPad ist dabei streng:
   - Der Ton muss durch ein Tippen des Benutzers "freigeschaltet" werden.
   - Nach jedem Neuladen der Seite muss das erneut passieren.
   Deshalb schaltet JARVIS den Ton bei jedem Senden-Tippen leise frei
   (unlockSpeech) und meldet sich, falls trotzdem kein Ton kommt. */
const speechSupported = "speechSynthesis" in window;
const VOICE_KEY = "jarvis-stimme-v1";
let voiceOn = false;
let speechUnlocked = false;
let speechWarned = false;

// Stimmen früh laden: Safari liefert die Liste oft erst verzögert
if (speechSupported) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function () {
    window.speechSynthesis.getVoices();
  };
}

function pickGermanVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("de")) || null;
}

/* --- NEU in 1.4.2: Stimme wählen und einstellen --- */
const PREF_KEY = "jarvis-stimme-einstellung-v1";
const DEFAULT_RATE = 0.95;
const DEFAULT_PITCH = 0.9;
let voicePrefs = { voiceURI: null, rate: DEFAULT_RATE, pitch: DEFAULT_PITCH };

// Die Auswahl bleibt dauerhaft gespeichert (auch nach Schließen des Tabs)
try {
  const saved = JSON.parse(localStorage.getItem(PREF_KEY));
  if (saved && typeof saved === "object") {
    voicePrefs.voiceURI = saved.voiceURI || null;
    if (typeof saved.rate === "number")  voicePrefs.rate = saved.rate;
    if (typeof saved.pitch === "number") voicePrefs.pitch = saved.pitch;
  }
} catch (e) {}

function savePrefs() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify(voicePrefs)); } catch (e) {}
}

function germanVoices() {
  if (!speechSupported) return [];
  return window.speechSynthesis.getVoices()
    .filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("de"));
}

function allVoices() {
  return speechSupported ? window.speechSynthesis.getVoices() : [];
}

function langCode() { return lang === "en" ? "en" : "de"; }

function langVoices() {
  const code = langCode();
  return allVoices()
    .filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(code))
    .sort((a, b) => (b.lang.toLowerCase().includes("gb") ? 1 : 0) - (a.lang.toLowerCase().includes("gb") ? 1 : 0));
}

function pickVoice() {
  const chosen = allVoices().find(v => v.voiceURI === voicePrefs.voiceURI);
  if (chosen && chosen.lang && chosen.lang.toLowerCase().replace("_", "-").startsWith(langCode())) return chosen;
  return langVoices()[0] || null;
}

function voiceLabel(v) {
  return v.name + " (" + v.lang.replace("_", "-") + ")";
}

// "Stimme wechseln" = nur deutsche Stimmen, "Stimme wechseln alle" = alle Stimmen von Safari
function switchVoice(useAll) {
  if (!speechSupported) return "Dieser Browser unterstützt keine Sprachausgabe, Sir.";
  const german = germanVoices();
  const list = useAll ? allVoices() : german;

  if (allVoices().length === 0) {
    return "Safari zeigt mir derzeit keine Stimmen, Sir. Laden Sie die Seite neu und versuchen Sie es noch einmal.";
  }
  if (!useAll && german.length === 0) {
    return "Safari bietet mir keine deutsche Stimme an, Sir. Mit \u201EStimme wechseln alle\u201C probiere ich Stimmen anderer Sprachen, die Deutsch mit fremdem Akzent lesen.";
  }
  if (!useAll && german.length === 1) {
    return "Safari bietet mir nur eine deutsche Stimme an: " + german[0].name + ". Mit \u201EStimme wechseln alle\u201C probiere ich Stimmen anderer Sprachen, die Deutsch mit fremdem Akzent lesen. Bessere Stimmen lassen sich in den iPad-Einstellungen laden, ob Safari sie dann anzeigt, kann ich nicht zusichern.";
  }

  const current = pickVoice();
  const index = list.findIndex(v => current && v.voiceURI === current.voiceURI);
  const next = list[(index + 1) % list.length];
  if (next === current) {
    return "Safari bietet mir keine weitere Stimme an, Sir. Es bleibt bei " + voiceLabel(current) + ".";
  }
  voicePrefs.voiceURI = next.voiceURI;
  savePrefs();
  const pos = list.indexOf(next) + 1;
  const info = "Stimme " + pos + " von " + list.length + ": " + voiceLabel(next) + ".";
  if (voiceOn) {
    // Sofort in der neuen Stimme sprechen, damit man den Unterschied hört
    setTimeout(() => speak("Hallo Sir, ich spreche jetzt mit der Stimme " + next.name + ". Gefällt Ihnen diese Stimme?"), 300);
    return "Neue Stimme. " + info + " Ich spreche sie gleich an.";
  }
  return "Neue Stimme. " + info + " Schalten Sie den Lautsprecher ein, um sie zu hören.";
}

function listVoices() {
  const all = allVoices();
  if (all.length === 0) return "Safari zeigt mir derzeit keine Stimmen, Sir.";
  const german = germanVoices();
  const others = all.filter(v => !german.includes(v));
  const current = pickVoice();
  return "Safari zeigt " + all.length + (all.length === 1 ? " Stimme" : " Stimmen") + ". Deutsch (" + german.length + "): " +
    (german.map(v => v.name).join(", ") || "keine") +
    ". Andere: " + (others.slice(0, 10).map(voiceLabel).join(", ") || "keine") + (others.length > 10 ? " \u2026" : "") +
    ". Aktuell: " + (current ? voiceLabel(current) : "Standard") + ".";
}

function tuneVoice(t) {
  if (/tiefer/.test(t))         voicePrefs.pitch = Math.max(0.5, +(voicePrefs.pitch - 0.15).toFixed(2));
  else if (/höher/.test(t))     voicePrefs.pitch = Math.min(1.5, +(voicePrefs.pitch + 0.15).toFixed(2));
  else if (/schneller/.test(t)) voicePrefs.rate  = Math.min(1.4, +(voicePrefs.rate + 0.1).toFixed(2));
  else if (/langsamer/.test(t)) voicePrefs.rate  = Math.max(0.6, +(voicePrefs.rate - 0.1).toFixed(2));
  savePrefs();
  return "Wie gewünscht, Sir. So klingt es jetzt.";
}

function resetVoice() {
  voicePrefs = { voiceURI: null, rate: DEFAULT_RATE, pitch: DEFAULT_PITCH };
  savePrefs();
  return "Die Stimme ist auf die Standardwerte zurückgesetzt, Sir.";
}

// Text für die Aussprache säubern: keine Aufzählungspunkte, keine Anführungszeichen
function speakableText(text) {
  return text
    .replace(/J\.A\.R\.V\.I\.S\./g, "Jarvis")
    .replace(/[\u2022\u201E\u201C\u201D]/g, "")
    .replace(/\s*\n+\s*/g, ". ")
    .trim();
}

// Leise Freischaltung: wird direkt im Tippen/Enter des Benutzers aufgerufen
function unlockSpeech() {
  if (!speechSupported || !voiceOn || speechUnlocked) return;
  try {
    window.speechSynthesis.resume();
    const silent = new SpeechSynthesisUtterance(".");
    silent.volume = 0;
    window.speechSynthesis.speak(silent);
  } catch (e) {}
  speechUnlocked = true;
}

function speakNow(text) {
  if (!speechSupported || !voiceOn) return;
  const clean = speakableText(text);
  if (!clean) return;

  const synth = window.speechSynthesis;
  // Nur abbrechen, wenn wirklich etwas läuft (beim ersten Mal muss speak() sofort passieren)
  const wasBusy = synth.speaking || synth.pending;
  if (wasBusy) synth.cancel();
  synth.resume();                                  // falls Safari die Ausgabe angehalten hat

  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = lang === "en" ? "en-GB" : "de-DE";
  utter.rate = voicePrefs.rate;
  utter.pitch = voicePrefs.pitch;
  const voice = pickVoice();
  if (voice) utter.voice = voice;
  if (voice && voice.lang) utter.lang = voice.lang;   // Sprache passend zur gewählten Stimme

  let started = false;
  utter.onstart = () => {
    started = true;
    speechUnlocked = true;
    reactorEl.classList.add("speaking");
  };
  utter.onend = () => reactorEl.classList.remove("speaking");
  utter.onerror = (e) => {
    reactorEl.classList.remove("speaking");
    if (e.error && e.error !== "canceled" && e.error !== "interrupted") {
      addMessage("system", "Die Sprachausgabe meldet einen Fehler: " + e.error + ".");
    }
  };

  if (wasBusy) setTimeout(() => synth.speak(utter), 120);   // Pause nach cancel()
  else synth.speak(utter);

  // Wächter: Kam nach 3,5 Sekunden kein Ton, sagt JARVIS Bescheid (nur einmal)
  setTimeout(function () {
    if (!started && !speechWarned && voiceOn && !document.hidden) {
      speechWarned = true;
      addMessage("system", L("Es kam kein Ton, Sir. Prüfen Sie Lautstärke und Stummschaltung. Schalten Sie danach den Lautsprecher-Knopf aus und wieder an. Nach der Spracheingabe kann Safari den Ton kurz sperren; dann hilft ebenfalls Aus- und Einschalten.", "No sound, Sir. Check the volume and mute switch. Then switch the speaker button off and on again. After voice input Safari may briefly block sound; switching off and on helps too."));
    }
  }, 3500);
}

// Fehler in der Sprachausgabe dürfen den Chat nie stören
function speak(text) {
  try { speakNow(text); } catch (e) {}
}

function setVoice(on) {
  voiceOn = on;
  voiceBtn.classList.toggle("on", on);
  voiceBtn.setAttribute("aria-pressed", String(on));
  try { sessionStorage.setItem(VOICE_KEY, on ? "an" : "aus"); } catch (e) {}

  if (!on && speechSupported) {
    window.speechSynthesis.cancel();
    reactorEl.classList.remove("speaking");
  }
}

voiceBtn.addEventListener("click", function () {
  if (!speechSupported) {
    addMessage("system", "Dieser Browser unterstützt keine Sprachausgabe, Sir.");
    return;
  }
  setVoice(!voiceOn);
  if (voiceOn) {
    speak(L("Sprachausgabe aktiviert, Sir.", "Voice output activated, Sir."));        // das Tippen schaltet den Ton in Safari frei
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0 && !pickGermanVoice()) {
      addMessage("system", "Hinweis: Ich finde keine deutsche Stimme. Laden Sie eine unter Einstellungen, Bedienungshilfen, Gesprochene Inhalte, Stimmen, Deutsch herunter.");
    }
  }
});

/* --- Sprache umschalten (NEU in 1.5) --- */
const CHIP_LABELS = {
  "Wie spät ist es?": ["Uhrzeit", "Time"],
  "Welches Datum haben wir?": ["Datum", "Date"],
  "Timer 5 Minuten": ["Timer 5 Min.", "Timer 5 min"],
  "Erzähl einen Witz": ["Witz", "Joke"],
  "Stimme wechseln": ["Stimme", "Voice"],
  "Hilfe": ["Hilfe", "Help"]
};

function applyLanguage() {
  document.documentElement.lang = langCode();
  langBtn.textContent = lang === "en" ? "EN" : "DE";
  updateStatus();
  inputEl.placeholder = L("Schreiben Sie an JARVIS \u2026", "Write to JARVIS \u2026");
  micBtn.setAttribute("aria-label", L("Spracheingabe", "Voice input"));
  document.querySelectorAll("#chips button[data-cmd]").forEach(function (b) {
    const pair = CHIP_LABELS[b.dataset.cmd];
    if (pair) b.textContent = lang === "en" ? pair[1] : pair[0];
  });
}

function setLanguage(next) {
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
  applyLanguage();
  if (speechSupported) window.speechSynthesis.cancel();
  return next === "en"
    ? "English is now active, Sir. Voice, text and commands follow."
    : "Deutsch ist jetzt aktiv, Sir. Stimme, Text und Befehle folgen.";
}

langBtn.addEventListener("click", function () {
  const reply = setLanguage(lang === "en" ? "de" : "en");
  addMessage("jarvis", reply, commandTag());
  speak(reply);
});

// Tippen auf den Reaktor stoppt die Sprachausgabe sofort
reactorEl.addEventListener("click", function () {
  if (speechSupported) window.speechSynthesis.cancel();
  reactorEl.classList.remove("speaking");
});

/* ----- 7. Nachricht senden ----- */
let busy = false;   // verhindert doppeltes Senden, solange JARVIS "denkt"

async function handleSend(refocus = true) {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  unlockSpeech();   // NEU: Ton direkt im Tippen freischalten (Safari-Regel)

  busy = true;
  sendBtn.disabled = true;

  addMessage("user", text);
  inputEl.value = "";
  autoGrow();

  showTyping();
  try {
    const reply = await getJarvisReply(text);
    hideTyping();
    addMessage("jarvis", reply.text, reply.tag);
    speak(reply.text);   // NEU in 1.1: nur der Text wird gesprochen, nicht der Hinweis
  } catch (error) {
    hideTyping();
    addMessage("system", L("Verbindungsproblem, Sir. Bitte versuchen Sie es erneut.", "Connection problem, Sir. Please try again."));
  }

  busy = false;
  sendBtn.disabled = false;
  if (refocus) inputEl.focus();   // Tastatur nur bei Tippen/Enter wieder öffnen, nicht bei Schnellbefehl oder Sprache
}

/* ----- 8. Eingabefeld: wächst mit, Enter sendet ----- */
function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
}

inputEl.addEventListener("input", autoGrow);

inputEl.addEventListener("keydown", function (event) {
  // Enter = senden, Shift + Enter = neue Zeile
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    handleSend();
  }
});

formEl.addEventListener("submit", function (event) {
  event.preventDefault();   // verhindert, dass die Seite neu lädt
  handleSend();
});

/* ----- 9. SPRACHEINGABE (NEU in 1.3) -----
   Nutzt die Spracherkennung des Browsers (in Safari: webkitSpeechRecognition).
   Kostenlos, ohne eigenen Schlüssel. Ablauf:
   Mikrofon antippen -> sprechen -> kurze Pause -> Text erscheint im
   Eingabefeld und wird automatisch gesendet.
   Hinweis: Safari braucht dafür meist eine Internetverbindung, und die
   Seite sollte über https laufen (z. B. CodePen oder eigenes Hosting). */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

function setListening(on) {
  listening = on;
  micBtn.classList.toggle("listening", on);
  micBtn.setAttribute("aria-pressed", String(on));
  reactorEl.classList.toggle("listening", on);
  inputEl.placeholder = on ? L("JARVIS hört zu \u2026", "JARVIS is listening \u2026") : L("Schreiben Sie an JARVIS \u2026", "Write to JARVIS \u2026");
}

function speechErrorText(code) {
  switch (code) {
    case "not-allowed":
    case "service-not-allowed":
      return L(
        "Der Zugriff auf das Mikrofon wurde nicht erlaubt, Sir. Erlauben Sie ihn in Safari (Symbol \u201EAA\u201C in der Adresszeile, dann Webseiteneinstellungen) und prüfen Sie unter Einstellungen, Allgemein, Tastatur, ob das Diktieren aktiviert ist.",
        "Microphone access was not allowed, Sir. Allow it in Safari (the \u201EAA\u201C symbol in the address bar, then Website settings) and check under Settings, General, Keyboard that dictation is enabled."
      );
    case "no-speech":
      return L("Ich habe nichts gehört, Sir. Bitte versuchen Sie es noch einmal.", "I heard nothing, Sir. Please try again.");
    case "audio-capture":
      return L("Es wurde kein Mikrofon gefunden, Sir.", "No microphone was found, Sir.");
    case "network":
      return L("Die Spracherkennung braucht eine Internetverbindung, Sir.", "Speech recognition needs an internet connection, Sir.");
    default:
      return L(
        "Die Spracheingabe ist fehlgeschlagen (" + code + "), Sir. Sie können weiterhin tippen.",
        "Voice input failed (" + code + "), Sir. You can still type."
      );
  }
}

function startListening() {
  if (busy) return;

  // Sprachausgabe stoppen, damit JARVIS sich nicht selbst zuhört
  if (speechSupported) {
    window.speechSynthesis.cancel();
    reactorEl.classList.remove("speaking");
  }

  recognition = new SpeechRecognitionAPI();
  recognition.lang = lang === "en" ? "en-GB" : "de-DE";
  recognition.interimResults = true;    // Text erscheint schon während des Sprechens
  recognition.continuous = false;       // endet nach einer Sprechpause
  let hadError = false;

  recognition.onstart = function () { setListening(true); };

  recognition.onresult = function (event) {
    let transcript = "";
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    inputEl.value = transcript;
    autoGrow();
  };

  recognition.onerror = function (event) {
    if (event.error === "aborted") return;   // vom Benutzer selbst gestoppt
    hadError = true;
    addMessage("system", speechErrorText(event.error));
  };

  recognition.onend = function () {
    setListening(false);
    recognition = null;
    if (!hadError && inputEl.value.trim()) handleSend(false);   // automatisch senden
  };

  try {
    recognition.start();
  } catch (e) {
    setListening(false);
    recognition = null;
    addMessage("system", "Die Spracheingabe konnte nicht gestartet werden, Sir.");
  }
}

micBtn.addEventListener("click", function () {
  if (!SpeechRecognitionAPI) {
    addMessage("system", "Dieser Browser unterstützt keine Spracheingabe, Sir. Sie können weiterhin tippen.");
    return;
  }
  if (listening && recognition) {
    recognition.stop();      // zweites Tippen beendet die Aufnahme und sendet
  } else {
    startListening();
  }
});

/* ----- 9b. Schnellbefehle (NEU in 1.2) ----- */
document.getElementById("chips").addEventListener("click", function (event) {
  const btn = event.target.closest("button[data-cmd]");
  if (!btn || busy) return;
  inputEl.value = btn.dataset.cmd;
  handleSend(false);
});

/* ----- 9c. Tastatur-Anpassung und Fehleranzeige (NEU in 1.4.1) ----- */
function fitToScreen() {
  const vv = window.visualViewport;
  if (!vv) return;
  document.documentElement.style.setProperty("--app-h", vv.height + "px");
  if (window.scrollY !== 0) window.scrollTo(0, 0);
  scrollToBottom();
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitToScreen);
  fitToScreen();
}

// Falls doch ein Fehler im Code steckt: sichtbar machen statt still scheitern
let errorShown = false;
window.addEventListener("error", function (event) {
  if (errorShown) return;
  errorShown = true;
  addMessage("system", "Interner Fehler: " + (event.message || "unbekannt") + ". Bitte schicken Sie mir diese Meldung, Sir.");
});

/* ----- 10. Start ----- */
applyLanguage();
history = loadHistory();

// Merkt sich innerhalb der Sitzung, ob die Stimme an war (Ton startet erst nach neuem Tippen)
try {
  if (sessionStorage.getItem(VOICE_KEY) === "an" && speechSupported) {
    voiceOn = true;
    voiceBtn.classList.add("on");
    voiceBtn.setAttribute("aria-pressed", "true");
  }
} catch (e) {}

if (history.length === 0) {
  addMessage("jarvis", greeting());
} else {
  history.forEach(renderMessage);   // Verlauf nach Neuladen wiederherstellen
}

  </script>
</body>
