<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: Inhalt darf bis an den iPad-Rand gehen; wir halten selbst Abstand (siehe CSS) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b14">
  <title>J.A.R.V.I.S.</title>
  <style>
/* ===== 1. Farben & Grundwerte (Variablen) ===== */
:root {
  --bg-0: #03070d;        /* tiefster Hintergrund */
  --bg-1: #08121f;        /* Flächen */
  --bg-2: #0d1c30;        /* Eingabefeld, Sprechblasen */
  --line: #15324f;        /* feine Linien */
  --cyan: #3de8ff;        /* Hauptakzent */
  --blue: #2f7bff;        /* Zweitakzent */
  --text: #e3f2ff;
  --text-dim: #7f9bb8;
  --radius: 18px;
  --font: "Avenir Next", "Helvetica Neue", -apple-system, "SF Pro Text", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* Sanftes Leuchten im Hintergrund */
body {
  background:
    radial-gradient(ellipse 70% 40% at 50% -10%, rgba(47, 123, 255, 0.22), transparent 70%),
    var(--bg-0);
}

/* ===== 2. Layout: Kopfzeile, Chat, Eingabe ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;                 /* korrekte Höhe in Safari */
  max-width: 900px;
  margin: 0 auto;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}

.title h1 {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  color: var(--cyan);
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-dim);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}

/* ===== 3. Der Reaktor (das markante Element) ===== */
.reactor {
  position: relative;
  width: 58px;
  height: 58px;
  flex-shrink: 0;
}

.reactor .ring,
.reactor .core {
  position: absolute;
  border-radius: 50%;
}

.ring-outer {
  inset: 0;
  border: 2px solid transparent;
  border-top-color: var(--cyan);
  border-bottom-color: var(--cyan);
  animation: spin 8s linear infinite;
}

.ring-middle {
  inset: 9px;
  border: 2px dashed rgba(61, 232, 255, 0.55);
  animation: spin 12s linear infinite reverse;
}

.ring-inner {
  inset: 18px;
  border: 2px solid var(--blue);
  box-shadow: 0 0 10px rgba(47, 123, 255, 0.7);
}

.core {
  inset: 25px;
  background: radial-gradient(circle, #ffffff 0%, var(--cyan) 55%, transparent 100%);
  animation: pulse 3s ease-in-out infinite;
}

/* Wenn JARVIS "nachdenkt", dreht sich der Reaktor schneller */
.reactor.thinking .ring-outer  { animation-duration: 1.6s; }
.reactor.thinking .ring-middle { animation-duration: 2.4s; }
.reactor.thinking .core        { animation-duration: 0.9s; }

@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes pulse {
  0%, 100% { opacity: 0.75; transform: scale(0.9); }
  50%      { opacity: 1;    transform: scale(1.15); }
}

/* Wenn JARVIS spricht, pulsiert der Kern schneller */
.reactor.speaking .core        { animation-duration: 0.7s; }
.reactor.speaking .ring-outer  { animation-duration: 3s; }

/* Schalter für die Sprachausgabe (NEU in 1.1) */
.voice-toggle { margin-left: auto; }
.voice-toggle .waves { display: none; }
.voice-toggle .slash { display: block; }
.voice-toggle.on {
  background: rgba(61, 232, 255, 0.12);
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(61, 232, 255, 0.35);
}
.voice-toggle.on .waves { display: block; }
.voice-toggle.on .slash { display: none; }

/* ===== 4. Nachrichten ===== */
.chat {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 82%;
  padding: 12px 16px;
  border-radius: var(--radius);
  line-height: 1.5;
  font-size: 1rem;
  white-space: pre-wrap;          /* Zeilenumbrüche bleiben erhalten */
  overflow-wrap: anywhere;
  animation: appear 0.3s ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* JARVIS: links, dunkel, cyanfarbene Linie */
.msg.jarvis {
  align-self: flex-start;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-left: 3px solid var(--cyan);
  border-top-left-radius: 4px;
}

/* Benutzer: rechts, blau */
.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #1b4fb8, #2f7bff);
  border-top-right-radius: 4px;
}

/* Systemhinweise (z. B. Mikrofon): zentriert, dezent */
.msg.system {
  align-self: center;
  max-width: 90%;
  background: transparent;
  border: 1px dashed var(--line);
  color: var(--text-dim);
  font-size: 0.9rem;
  text-align: center;
}

.msg .who {
  display: block;
  margin-bottom: 4px;
  font-size: 0.75rem;
  color: var(--cyan);
  letter-spacing: 0.08em;
}

.msg .tag {
  display: block;
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* "JARVIS schreibt …" Animation */
.typing {
  display: flex;
  gap: 5px;
  padding: 16px;
}
.typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40%           { opacity: 1; }
}

/* ===== 5. Eingabebereich ===== */
.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--line);
  background: var(--bg-0);
}

.composer textarea {
  flex: 1;
  min-height: 46px;
  max-height: 140px;
  padding: 12px 16px;
  resize: none;
  background: var(--bg-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 23px;
  font-family: var(--font);
  font-size: 16px;                /* mindestens 16px, sonst zoomt Safari beim Tippen */
  line-height: 1.4;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.composer textarea::placeholder { color: var(--text-dim); }

.composer textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(61, 232, 255, 0.15);
}

.icon-btn,
.send-btn {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.icon-btn {
  background: transparent;
  color: var(--cyan);
  border: 1px solid var(--line);
}

.send-btn {
  background: var(--cyan);
  color: #03121a;
  border: none;
}

.icon-btn:active,
.send-btn:active { transform: scale(0.92); }

.send-btn:disabled {
  background: var(--line);
  color: var(--text-dim);
  cursor: default;
}

button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

/* Mikrofon aktiv (NEU in 1.3) */
.icon-btn.listening {
  background: var(--cyan);
  color: #03121a;
  border-color: var(--cyan);
  animation: listen 1.4s ease-in-out infinite;
}
@keyframes listen {
  0%, 100% { box-shadow: 0 0 0 0 rgba(61, 232, 255, 0.55); }
  50%      { box-shadow: 0 0 0 10px rgba(61, 232, 255, 0); }
}
.reactor.listening .ring-middle { animation-duration: 3s; }
.reactor.listening .core        { animation-duration: 1.2s; }

/* ===== 5b. Schnellbefehle (NEU in 1.2) ===== */
.chips {
  display: flex;
  gap: 8px;
  padding: 10px 16px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.chips button {
  flex-shrink: 0;
  min-height: 36px;
  padding: 0 14px;
  background: transparent;
  color: var(--cyan);
  border: 1px solid var(--line);
  border-radius: 18px;
  font-family: var(--font);
  font-size: 0.9rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s, border-color 0.2s;
}
.chips button:active {
  background: rgba(61, 232, 255, 0.12);
  border-color: var(--cyan);
}

/* ===== 6. Kleine Bildschirme ===== */
@media (max-width: 600px) {
  .topbar { padding: 12px 14px; }
  .chat   { padding: 14px; }
  .msg    { max-width: 90%; }
}

/* ===== 7. Bewegung reduzieren, falls im iPad so eingestellt ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

  </style>
</head>
<body>

  <div class="app">

    <!-- Kopfzeile: Reaktor + Name + Status -->
    <header class="topbar">
      <div class="reactor" id="reactor" aria-hidden="true">
        <span class="ring ring-outer"></span>
        <span class="ring ring-middle"></span>
        <span class="ring ring-inner"></span>
        <span class="core"></span>
      </div>
      <div class="title">
        <h1>J.A.R.V.I.S.</h1>
        <p class="status"><span class="dot"></span>Online, KI-Modul noch nicht verbunden</p>
      </div>

      <!-- NEU in 1.1: Schalter für die Sprachausgabe -->
      <button type="button" class="icon-btn voice-toggle" id="voice-btn" aria-pressed="false" aria-label="Sprachausgabe ein- oder ausschalten">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"></path>
          <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"></path>
          <path class="slash" d="M16 9l5 6M21 9l-5 6"></path>
        </svg>
      </button>
    </header>

    <!-- Chatverlauf: Nachrichten werden per JavaScript hier eingefügt -->
    <main class="chat" id="chat" aria-live="polite"></main>

    <!-- NEU in 1.2: Schnellbefehle zum Antippen -->
    <div class="chips" id="chips">
      <button type="button" data-cmd="Wie spät ist es?">Uhrzeit</button>
      <button type="button" data-cmd="Welches Datum haben wir?">Datum</button>
      <button type="button" data-cmd="Timer 5 Minuten">Timer 5 Min.</button>
      <button type="button" data-cmd="Hilfe">Hilfe</button>
    </div>

    <!-- Eingabebereich -->
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn" id="mic-btn" aria-label="Spracheingabe">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
      </button>

      <textarea id="input" rows="1" placeholder="Schreiben Sie an JARVIS …" enterkeyhint="send" aria-label="Nachricht"></textarea>

      <button type="submit" class="send-btn" id="send-btn" aria-label="Senden">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
    </form>
  </div>

  <script>
/* =====================================================
   J.A.R.V.I.S. Version 1.3 – Funktionen
   ===================================================== */

/* ----- 1. Elemente aus der HTML-Seite holen ----- */
const chatEl     = document.getElementById("chat");
const formEl     = document.getElementById("composer");
const inputEl    = document.getElementById("input");
const sendBtn    = document.getElementById("send-btn");
const micBtn     = document.getElementById("mic-btn");
const reactorEl  = document.getElementById("reactor");
const voiceBtn   = document.getElementById("voice-btn");

/* ----- 2. Chatverlauf (bleibt während der Sitzung erhalten) ----- */
// Der Verlauf liegt in einer Liste. Zusätzlich speichern wir ihn in
// sessionStorage: Das überlebt ein Neuladen im selben Safari-Tab,
// wird aber gelöscht, sobald der Tab geschlossen wird.
const STORAGE_KEY = "jarvis-verlauf-v1";
let history = [];   // Einträge: { role: "jarvis" | "user" | "system", text: "...", tag: "..." }

function saveHistory() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) {
    // Speichern nicht möglich (z. B. privater Modus): kein Problem, der Chat läuft trotzdem.
  }
}

function loadHistory() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

/* ----- 3. Nachrichten anzeigen ----- */
function renderMessage(entry) {
  const div = document.createElement("div");
  div.className = "msg " + entry.role;

  if (entry.role === "jarvis") {
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = "JARVIS";
    div.appendChild(who);
  }

  // textContent statt innerHTML: Eingaben werden nie als Code ausgeführt (Sicherheit).
  const body = document.createElement("span");
  body.textContent = entry.text;
  div.appendChild(body);

  if (entry.tag) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = entry.tag;
    div.appendChild(tag);
  }

  chatEl.appendChild(div);
  scrollToBottom();
}

function addMessage(role, text, tag) {
  const entry = { role, text, tag };
  history.push(entry);
  saveHistory();
  renderMessage(entry);
}

function scrollToBottom() {
  chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: "smooth" });
}

/* ----- 4. "JARVIS schreibt …" Anzeige ----- */
let typingEl = null;

function showTyping() {
  typingEl = document.createElement("div");
  typingEl.className = "msg jarvis typing";
  typingEl.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(typingEl);
  reactorEl.classList.add("thinking");   // Reaktor dreht schneller
  scrollToBottom();
}

function hideTyping() {
  if (typingEl) typingEl.remove();
  typingEl = null;
  reactorEl.classList.remove("thinking");
}

/* ----- 5. Begrüßung ----- */
function greeting() {
  const hour = new Date().getHours();
  let part = "Guten Tag";
  if (hour < 11) part = "Guten Morgen";
  else if (hour >= 18) part = "Guten Abend";

  return part + ", Sir. Alle Systeme laufen. Eine KI ist noch nicht angeschlossen, aber Uhrzeit, Datum, Timer und Rechnen beherrsche ich bereits. Sagen Sie „Hilfe“ für die Übersicht.";
}

/* ----- 6. PLATZHALTER für die spätere KI-Anbindung -----
   Hier wird später die echte KI angebunden.

   WICHTIG: Den API-Schlüssel NIEMALS hier im Frontend speichern.
   Jeder könnte ihn im Browser auslesen. Der richtige Weg:
     Browser (diese Seite)  ->  eigener kleiner Server  ->  KI-Dienst
   Der Schlüssel liegt nur auf dem Server. Die Seite schickt dann
   nur den Text an deinen Server, zum Beispiel so:

     const antwort = await fetch("/api/chat", {
       method: "POST",
       headers: { "Content-Type": "application/json" },
       body: JSON.stringify({ message: userText })
     });
     const daten = await antwort.json();
     return { text: daten.reply, tag: null };

   Bis dahin gibt die Funktion ehrlich zurück, dass keine KI verbunden ist.
*/
async function getJarvisReply(userText) {
  // NEU in 1.2: Zuerst prüfen, ob es ein lokaler Befehl ist
  const commandReply = handleCommand(userText);
  if (commandReply !== null) {
    await sleep(350);
    return { text: commandReply, tag: COMMAND_TAG };
  }

  await sleep(700); // kurze Denkpause für das Gefühl

  return {
    text:
      "Ihre Nachricht ist angekommen, Sir: \u201E" + userText + "\u201C. " +
      "Inhaltlich antworten kann ich noch nicht, denn es ist keine KI verbunden. " +
      "Das ist keine Ausrede, sondern ein Bauzustand. Mit „Hilfe“ sehen Sie, was ich bereits kann.",
    tag: "Platzhalter-Antwort, keine echte KI"
  };
}

/* ----- 6c. LOKALE BEFEHLE (NEU in 1.2) -----
   Das ist KEINE KI. Es sind feste Regeln: Erkennt JARVIS ein Stichwort
   (z. B. "Uhrzeit"), führt er die passende Funktion aus. Alles andere
   geht weiter an den KI-Platzhalter. */
const COMMAND_TAG = "Lokaler Befehl, keine KI";
const timers = [];   // laufende Timer (nur solange die Seite offen ist)

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const sec = Math.round(totalSeconds % 60);
  const parts = [];
  if (h)   parts.push(h + (h === 1 ? " Stunde" : " Stunden"));
  if (m)   parts.push(m + (m === 1 ? " Minute" : " Minuten"));
  if (sec) parts.push(sec + (sec === 1 ? " Sekunde" : " Sekunden"));
  return parts.join(", ") || "0 Sekunden";
}

/* --- Uhrzeit und Datum --- */
function timeAnswer() {
  const now = new Date();
  const text = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  let answer = "Es ist " + text + " Uhr";
  if (now.getHours() < 5) answer += ". Eine bemerkenswerte Stunde für Ingenieursarbeit";
  return answer;
}

function dateAnswer() {
  const text = new Date().toLocaleDateString("de-DE", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  return "Heute ist " + text;
}

/* --- Timer --- */
function parseSeconds(t) {
  // Findet z. B. "1 stunde 30 minuten" oder "45 sek" und zählt alles zusammen
  const pattern = /(\d+(?:[.,]\d+)?)\s*(stunden?|std|h|minuten?|min|sekunden?|sek|s)\b/g;
  let total = 0;
  let match;
  while ((match = pattern.exec(t)) !== null) {
    const amount = parseFloat(match[1].replace(",", "."));
    const unit = match[2];
    if (unit === "h" || unit.startsWith("st")) total += amount * 3600;
    else if (unit.startsWith("m"))            total += amount * 60;
    else                                      total += amount;
  }
  return Math.round(total);
}

function startTimer(t) {
  const seconds = parseSeconds(t);

  if (seconds <= 0) {
    return "Wie lange soll der Timer laufen, Sir? Zum Beispiel: \u201ETimer 5 Minuten\u201C.";
  }
  if (seconds > 24 * 3600) {
    return "Mehr als 24 Stunden kann ich nicht überwachen, Sir. Selbst meine Geduld hat Grenzen.";
  }
  if (timers.length >= 5) {
    return "Fünf Timer laufen bereits, Sir. Ich rate zu einer Priorisierung.";
  }

  const label = formatDuration(seconds);
  const handle = setTimeout(function () {
    const index = timers.findIndex(x => x.handle === handle);
    if (index !== -1) timers.splice(index, 1);
    const message = "Der Timer von " + label + " ist abgelaufen, Sir.";
    addMessage("jarvis", message, COMMAND_TAG);
    speak(message);
  }, seconds * 1000);

  timers.push({ handle, label });
  return "Timer auf " + label + " gestellt, Sir. Bitte lassen Sie diese Seite geöffnet, sonst kann ich nicht Bescheid geben.";
}

function cancelTimers() {
  if (timers.length === 0) return "Es läuft kein Timer, Sir.";
  const count = timers.length;
  timers.forEach(x => clearTimeout(x.handle));
  timers.length = 0;
  return count === 1 ? "Der Timer wurde abgebrochen, Sir." : count + " Timer wurden abgebrochen, Sir.";
}

/* --- Taschenrechner (ohne eval, nur + - * / und Klammern) --- */
function calculate(raw) {
  const s = raw.replace(/\s+/g, "").replace(/,/g, ".").replace(/[x×]/g, "*").replace(/:/g, "/");
  let pos = 0;

  function parseExpr() {
    let value = parseTerm();
    while (s[pos] === "+" || s[pos] === "-") {
      const op = s[pos++];
      const right = parseTerm();
      value = op === "+" ? value + right : value - right;
    }
    return value;
  }
  function parseTerm() {
    let value = parseFactor();
    while (s[pos] === "*" || s[pos] === "/") {
      const op = s[pos++];
      const right = parseFactor();
      value = op === "*" ? value * right : value / right;
    }
    return value;
  }
  function parseFactor() {
    if (s[pos] === "-") { pos++; return -parseFactor(); }
    if (s[pos] === "+") { pos++; return parseFactor(); }
    if (s[pos] === "(") {
      pos++;
      const value = parseExpr();
      if (s[pos] !== ")") throw new Error("Klammer fehlt");
      pos++;
      return value;
    }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(pos));
    if (!m) throw new Error("Zahl erwartet");
    pos += m[0].length;
    return parseFloat(m[0]);
  }

  try {
    const result = parseExpr();
    return pos === s.length ? result : null;
  } catch (e) {
    return null;
  }
}

function calcAnswer(t) {
  // Füllwörter vorne entfernen, Wörter in Zeichen umwandeln
  const candidate = t
    .replace(/^(rechne|berechne|was ist|was ergibt|wie viel ist|wieviel ist)\s*/, "")
    .replace(/\bgeteilt durch\b/g, "/")
    .replace(/\bdurch\b/g, "/")
    .replace(/\bmal\b/g, "*")
    .replace(/\bplus\b/g, "+")
    .replace(/\bminus\b/g, "-")
    .replace(/[?=]+$/, "")
    .trim();

  const looksLikeMath = /^[\d\s.,+\-*/()x×:]+$/.test(candidate)
    && /\d/.test(candidate)
    && /[+\-*/x×:]/.test(candidate);
  if (!looksLikeMath) return null;

  const result = calculate(candidate);
  if (result === null) return null;
  if (!isFinite(result)) return "Durch null zu teilen überlasse ich den Philosophen, Sir.";

  const shown = Number(result.toFixed(10)).toLocaleString("de-DE", { maximumFractionDigits: 10 });
  return "Das Ergebnis lautet " + shown;
}

/* --- Hilfe --- */
const HELP_TEXT =
  "Das beherrsche ich derzeit, Sir:\n" +
  "\u2022 Uhrzeit: \u201EWie spät ist es?\u201C\n" +
  "\u2022 Datum: \u201EWelches Datum haben wir?\u201C\n" +
  "\u2022 Timer: \u201ETimer 5 Minuten\u201C, abbrechen mit \u201ETimer abbrechen\u201C\n" +
  "\u2022 Rechnen: \u201ERechne 12 * (3 + 4)\u201C\n" +
  "\u2022 Sprache: Mikrofon antippen und sprechen\n" +
  "Für alles andere brauche ich die KI, die noch nicht angeschlossen ist.";

/* --- Zentrale: erkennt den Befehl. Gibt Text zurück oder null (= kein Befehl) --- */
function handleCommand(userText) {
  const t = userText.toLowerCase().trim();

  // Timer
  if (/\b(timer|stoppuhr)\b/.test(t) || /\berinnere\b/.test(t)) {
    if (/(abbrech|stopp|lösch|beend|aus\b)/.test(t)) return cancelTimers();
    return startTimer(t);
  }

  // Uhrzeit und/oder Datum
  const wantsTime = /(uhrzeit|wie spät|wie spaet|wie viel uhr|wieviel uhr)/.test(t);
  const wantsDate = /(datum|welcher tag|welchen tag|wochentag)/.test(t);
  if (wantsTime && wantsDate) return dateAnswer() + ". " + timeAnswer();
  if (wantsTime) return timeAnswer();
  if (wantsDate) return dateAnswer();

  // Hilfe
  if (/\b(hilfe|befehle)\b/.test(t) || /was kannst du/.test(t)) return HELP_TEXT;

  // Rechnen
  const calc = calcAnswer(t);
  if (calc !== null) return calc;

  // Kleine Höflichkeiten
  if (/^(hallo|hi|hey|guten (morgen|tag|abend))\b/.test(t)) return "Zu Diensten, Sir.";
  if (/^(danke|vielen dank)\b/.test(t)) return "Stets zu Diensten, Sir.";

  return null;
}

/* ----- 6b. SPRACHAUSGABE (NEU in 1.1) -----
   Nutzt die eingebaute Sprachausgabe des Browsers (speechSynthesis):
   kostenlos, ohne Anmeldung, ohne Internet-Dienst.
   Standardmäßig AUS. Safari erlaubt Ton erst nach einem Tippen des
   Benutzers, deshalb schaltet der Lautsprecher-Knopf sie ein. */
const speechSupported = "speechSynthesis" in window;
const VOICE_KEY = "jarvis-stimme-v1";
let voiceOn = false;

function pickGermanVoice() {
  const voices = window.speechSynthesis.getVoices();
  // Bevorzugt eine deutsche Stimme; sonst nimmt der Browser seine Standardstimme.
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith("de")) || null;
}

function speak(text) {
  if (!speechSupported || !voiceOn) return;

  window.speechSynthesis.cancel();                 // laufende Ausgabe stoppen
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "de-DE";
  utter.rate = 0.95;                               // minimal ruhiger
  utter.pitch = 0.9;                               // minimal tiefer
  const voice = pickGermanVoice();
  if (voice) utter.voice = voice;

  utter.onstart = () => reactorEl.classList.add("speaking");
  utter.onend   = () => reactorEl.classList.remove("speaking");
  utter.onerror = () => reactorEl.classList.remove("speaking");

  // Kleine Pause nach cancel(): Safari verschluckt sonst manchmal den Anfang
  setTimeout(() => window.speechSynthesis.speak(utter), 60);
}

function setVoice(on) {
  voiceOn = on;
  voiceBtn.classList.toggle("on", on);
  voiceBtn.setAttribute("aria-pressed", String(on));
  try { sessionStorage.setItem(VOICE_KEY, on ? "an" : "aus"); } catch (e) {}

  if (!on && speechSupported) {
    window.speechSynthesis.cancel();
    reactorEl.classList.remove("speaking");
  }
}

voiceBtn.addEventListener("click", function () {
  if (!speechSupported) {
    addMessage("system", "Dieser Browser unterstützt keine Sprachausgabe, Sir.");
    return;
  }
  setVoice(!voiceOn);
  if (voiceOn) speak("Sprachausgabe aktiviert, Sir.");   // das Tippen schaltet den Ton in Safari frei
});

/* ----- 7. Nachricht senden ----- */
let busy = false;   // verhindert doppeltes Senden, solange JARVIS "denkt"

async function handleSend() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;

  addMessage("user", text);
  inputEl.value = "";
  autoGrow();

  showTyping();
  try {
    const reply = await getJarvisReply(text);
    hideTyping();
    addMessage("jarvis", reply.text, reply.tag);
    speak(reply.text);   // NEU in 1.1: nur der Text wird gesprochen, nicht der Hinweis
  } catch (error) {
    hideTyping();
    addMessage("system", "Verbindungsproblem, Sir. Bitte versuchen Sie es erneut.");
  }

  busy = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

/* ----- 8. Eingabefeld: wächst mit, Enter sendet ----- */
function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
}

inputEl.addEventListener("input", autoGrow);

inputEl.addEventListener("keydown", function (event) {
  // Enter = senden, Shift + Enter = neue Zeile
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    handleSend();
  }
});

formEl.addEventListener("submit", function (event) {
  event.preventDefault();   // verhindert, dass die Seite neu lädt
  handleSend();
});

/* ----- 9. SPRACHEINGABE (NEU in 1.3) -----
   Nutzt die Spracherkennung des Browsers (in Safari: webkitSpeechRecognition).
   Kostenlos, ohne eigenen Schlüssel. Ablauf:
   Mikrofon antippen -> sprechen -> kurze Pause -> Text erscheint im
   Eingabefeld und wird automatisch gesendet.
   Hinweis: Safari braucht dafür meist eine Internetverbindung, und die
   Seite sollte über https laufen (z. B. CodePen oder eigenes Hosting). */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

function setListening(on) {
  listening = on;
  micBtn.classList.toggle("listening", on);
  micBtn.setAttribute("aria-pressed", String(on));
  reactorEl.classList.toggle("listening", on);
  inputEl.placeholder = on ? "JARVIS hört zu \u2026" : "Schreiben Sie an JARVIS \u2026";
}

function speechErrorText(code) {
  switch (code) {
    case "not-allowed":
    case "service-not-allowed":
      return "Der Zugriff auf das Mikrofon wurde nicht erlaubt, Sir. Erlauben Sie ihn in Safari (Symbol \u201EAA\u201C in der Adresszeile, dann Webseiteneinstellungen) und prüfen Sie unter Einstellungen, Allgemein, Tastatur, ob das Diktieren aktiviert ist.";
    case "no-speech":
      return "Ich habe nichts gehört, Sir. Bitte versuchen Sie es noch einmal.";
    case "audio-capture":
      return "Es wurde kein Mikrofon gefunden, Sir.";
    case "network":
      return "Die Spracherkennung braucht eine Internetverbindung, Sir.";
    default:
      return "Die Spracheingabe ist fehlgeschlagen (" + code + "), Sir. Sie können weiterhin tippen.";
  }
}

function startListening() {
  if (busy) return;

  // Sprachausgabe stoppen, damit JARVIS sich nicht selbst zuhört
  if (speechSupported) {
    window.speechSynthesis.cancel();
    reactorEl.classList.remove("speaking");
  }

  recognition = new SpeechRecognitionAPI();
  recognition.lang = "de-DE";
  recognition.interimResults = true;    // Text erscheint schon während des Sprechens
  recognition.continuous = false;       // endet nach einer Sprechpause
  let hadError = false;

  recognition.onstart = function () { setListening(true); };

  recognition.onresult = function (event) {
    let transcript = "";
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    inputEl.value = transcript;
    autoGrow();
  };

  recognition.onerror = function (event) {
    if (event.error === "aborted") return;   // vom Benutzer selbst gestoppt
    hadError = true;
    addMessage("system", speechErrorText(event.error));
  };

  recognition.onend = function () {
    setListening(false);
    recognition = null;
    if (!hadError && inputEl.value.trim()) handleSend();   // automatisch senden
  };

  try {
    recognition.start();
  } catch (e) {
    setListening(false);
    recognition = null;
    addMessage("system", "Die Spracheingabe konnte nicht gestartet werden, Sir.");
  }
}

micBtn.addEventListener("click", function () {
  if (!SpeechRecognitionAPI) {
    addMessage("system", "Dieser Browser unterstützt keine Spracheingabe, Sir. Sie können weiterhin tippen.");
    return;
  }
  if (listening && recognition) {
    recognition.stop();      // zweites Tippen beendet die Aufnahme und sendet
  } else {
    startListening();
  }
});

/* ----- 9b. Schnellbefehle (NEU in 1.2) ----- */
document.getElementById("chips").addEventListener("click", function (event) {
  const btn = event.target.closest("button[data-cmd]");
  if (!btn || busy) return;
  inputEl.value = btn.dataset.cmd;
  handleSend();
});

/* ----- 10. Start ----- */
history = loadHistory();

// Merkt sich innerhalb der Sitzung, ob die Stimme an war (Ton startet erst nach neuem Tippen)
try {
  if (sessionStorage.getItem(VOICE_KEY) === "an" && speechSupported) {
    voiceOn = true;
    voiceBtn.classList.add("on");
    voiceBtn.setAttribute("aria-pressed", "true");
  }
} catch (e) {}

if (history.length === 0) {
  addMessage("jarvis", greeting());
} else {
  history.forEach(renderMessage);   // Verlauf nach Neuladen wiederherstellen
}

  </script>
